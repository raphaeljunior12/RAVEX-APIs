services:
  - type: web
    name: ravex-apis
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /status
    autoDeploy: true
    envVars:
      - key: FUTEBOL_API_NOME
        value: "OpenLigaDB"
      - key: FUTEBOL_API_URL
        value: "https://api.openligadb.de"
      - key: NODE_VERSION
        value: "24"
